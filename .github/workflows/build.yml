name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Kein gradlew nötig: Gradle wird hier direkt bereitgestellt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle build

      - name: Fertige Mod hochladen
        uses: actions/upload-artifact@v4
        with:
          name: no-elytra-on-armor-stand
          path: build/libs/no-elytra-on-armor-stand-*[0-9].jar
