name: Build Mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Kein gradlew nötig: Gradle wird hier direkt bereitgestellt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle build

      - name: Fertige Mod hochladen
        uses: actions/upload-artifact@v4
        with:
          name: no-elytra-on-armor-stand
          path: build/libs/no-elytra-on-armor-stand-*[0-9].jar

      # Legt die fertige .jar als Download auf der Releases-Seite ab
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          gh release create "build-${{ github.run_number }}" "$JAR" \
            --title "Build ${{ github.run_number }}" \
            --notes "Fertige Mod für Minecraft 1.21.11. Die .jar herunterladen und in den mods-Ordner legen (Fabric API wird zusätzlich benötigt)."
