name: Inspect MCEF

on:
  push:
    paths:
      - 'inspect-mcef.trigger'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Codec-Patch lesen
        run: |
          git clone --depth 1 https://github.com/Ruinscraft/mcef-codec-patch repo
          cd repo
          git log -3 --format='%h %ad %s'
          find . -type f -not -path './.git/*' | head -50
          echo "#### README"; cat README* | head -80
          for f in $(find . -type f \( -name '*.java' -o -name '*.gradle' -o -name '*.json' -o -name '*.yml' \) -not -path './.git/*' | head -15); do echo "=== $f"; head -120 "$f"; done
      - name: jcefmaven Versionen
        run: |
          curl -s https://repo1.maven.org/maven2/me/friwi/jcef-maven/maven-metadata.xml | tail -15 || true
          curl -s https://repo1.maven.org/maven2/me/friwi/ | head -40 || true
