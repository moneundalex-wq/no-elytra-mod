name: Inspect MCEF

# Wird nur ausgelöst, wenn die Datei inspect-mcef.trigger geändert wird.
# Schreibt Teile des Quellcodes von MCEF Modern für Minecraft 1.21.11 ins Protokoll.
on:
  push:
    paths:
      - 'inspect-mcef.trigger'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Implementierung lesen
        run: |
          git clone --depth 1 --branch 1.21.11 https://github.com/DimasKama/mcef-modern repo
          cd repo
          echo "#### build.gradle"; cat build.gradle
          echo "#### accesswidener / resources"; find src -type f \( -name '*.accesswidener' -o -name 'fabric.mod.json' -o -name '*.json' \) | head -20
          for f in $(find src -name '*.accesswidener'); do echo "=== $f"; cat "$f"; done
          echo "#### MCEFBrowserImpl"; cat src/main/java/net/dimaskama/mcef/impl/MCEFBrowserImpl.java
          echo "#### MCEFApiImpl"; cat src/main/java/net/dimaskama/mcef/impl/MCEFApiImpl.java
