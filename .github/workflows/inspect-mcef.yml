name: Inspect MCEF

on:
  push:
    paths:
      - 'inspect-mcef.trigger'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Implementierung lesen
        run: |
          git clone --depth 1 --branch 1.21.11 https://github.com/DimasKama/mcef-modern repo
          cd repo
          echo "#### files"; find src -name '*.java' | head -80
          for f in $(find src -name 'MCEFApi.java' -o -name '*Test*Screen*.java' -o -name 'MCEFBrowser.java' -o -name 'MCEFModClient*.java'); do echo "=== $f"; cat "$f"; done
          echo "#### gradle.properties"; cat gradle.properties
          echo "#### MCEFApiImpl"; cat src/main/java/net/dimaskama/mcef/impl/MCEFApiImpl.java
